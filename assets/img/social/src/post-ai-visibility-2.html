<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Brand values lifted from index.html's Tailwind config, not eyeballed. */
  :root {
    --cream:#f5eee0; --ink:#141414; --ink2:#3a3a38;
    --muted:#76746e; --accent:#bf5b2e; --line:#e4e3dd;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1080px; }
  body {
    background:var(--cream); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:100px; position:relative;
  }
  .eyebrow {
    font-size:20px; font-weight:450; color:var(--muted);
    letter-spacing:.005em; margin-bottom:26px;
  }
  /* The receipt itself — an unedited crop of the real ChatGPT answer, not a redesign of it. */
  .shot-frame {
    background:#fff; border:1px solid var(--line); border-radius:14px;
    box-shadow:0 24px 60px -28px rgba(20,20,20,.28);
    padding:22px; overflow:hidden;
  }
  .shot-frame img { display:block; width:100%; height:auto; border-radius:4px; }
  .caption {
    margin-top:28px; font-size:22px; line-height:1.5; color:var(--ink2);
    max-width:800px;
  }
  footer {
    position:absolute; left:100px; bottom:92px;
    font-family:'JetBrains Mono',monospace; font-size:23px;
  }
  footer b { color:var(--accent); font-weight:500; }
  footer span { color:var(--muted); }
</style>
</head>
<body>
  <div class="eyebrow">The real answer</div>
  <div class="shot-frame">
    <img src="screenshots/chatgpt-shower-crop.png" alt="ChatGPT's actual answer">
  </div>
  <p class="caption">Asked live, screenshotted whole — not a mockup, not our copy in a nicer font.</p>
  <footer><b>@buildingwithc5</b> <span>&middot; helloc5.com</span></footer>
</body>
</html>
